name: studio

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d studio']
      interval: 5s
      timeout: 5s
      retries: 10

  # BullMQ backing store for the publish pipeline (step 9).
  redis:
    image: redis:7-alpine
    container_name: studio-redis
    restart: unless-stopped
    ports:
      # 6380 on the host — 6379 is often taken by a local Redis
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage — stands in for Cloudflare R2 locally.
  # Console at http://localhost:9001 (studio / studio-secret).
  minio:
    # MinIO no longer publishes minio/minio on Docker Hub; Chainguard's build of
    # the same server is used instead. It is a minimal image (no curl), so there
    # is no in-container healthcheck: minio-setup below waits for it instead.
    image: chainguard/minio:latest
    container_name: studio-minio
    restart: unless-stopped
    # The image runs as a non-root user, which cannot write a root-owned volume.
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  # One-shot: create the render bucket and make it publicly readable
  # (a CDN-fronted public bucket is what consumers fetch envelopes + assets from).
  minio-setup:
    # The -dev tag has a shell; the plain tag is the bare `mc` binary only.
    image: chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_started
    user: '0:0'
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint:
      - /bin/sh
      - -c
      - |
        n=0
        until mc alias set local http://minio:9000 studio studio-secret >/dev/null 2>&1; do
          n=$$((n + 1))
          if [ "$$n" -ge 60 ]; then echo 'minio did not come up'; exit 1; fi
          sleep 1
        done
        mc mb --ignore-existing local/studio-render &&
        mc anonymous set download local/studio-render &&
        mc mb --ignore-existing local/studio-render-app &&
        mc anonymous set download local/studio-render-app &&
        echo 'studio-render buckets ready'
    restart: 'no'

  # ─── Containerized Studio (profile: app) ─────────────────────────────────────
  # `docker compose up -d` stays infra-only for `pnpm dev`. The full stack:
  #   docker compose --profile app up -d --build
  #
  # It shares the infra containers above but NOT their data: its own database
  # (studio_app), Redis index (/1), and bucket (studio-render-app). The dev DB is
  # schema-pushed, which `payload migrate` refuses to run over, and a shared
  # queue would let this worker pick up jobs for dev-DB ids.

  db-setup:
    profiles: [app]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: studio
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U studio -d studio -tAc \"SELECT 1 FROM pg_database WHERE datname = 'studio_app'\" | grep -q 1 ||
      psql -h postgres -U studio -d studio -c 'CREATE DATABASE studio_app'
      "
    restart: 'no'

  migrate:
    profiles: [app]
    build: &studio-tools-build
      context: .
      target: tools
    image: studio-tools
    <<: &studio-runtime
      env_file:
        - path: .env
          required: false
      environment:
        DATABASE_URL: postgres://studio:studio@postgres:5432/studio_app
        REDIS_URL: redis://redis:6379/1
        S3_ENDPOINT: http://minio:9000
        S3_BUCKET: studio-render-app
        # Fetched by browsers/consumers, so host-reachable, not in-network.
        S3_PUBLIC_URL: http://localhost:9000/studio-render-app
        RENDER_ASSET_BASE_URL: http://localhost:9000/studio-render-app
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    command: ['node_modules/.bin/payload', 'migrate']
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: 'no'

  app:
    profiles: [app]
    build:
      context: .
      target: app
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    image: studio-app
    <<: *studio-runtime
    ports:
      - '3000:3000'
    volumes:
      - media_data:/app/public/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: [app]
    build: *studio-tools-build
    image: studio-tools
    <<: *studio-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  media_data:
