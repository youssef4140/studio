# Deploy Studio to the SHARED STAGING host (AWS staging account).
# Runs automatically on every push to "staging". It also lives on main so the
# "Run workflow" button shows in the Actions tab - pick branch "staging" there.
# AWS only accepts the deploy role from youssef4140/studio on branch "staging"
# (OIDC trust), so the job is skipped on any other branch.
# Source of truth: AWS-Terraform-Structure/docs/shared-staging/workflows/studio.yml
#
# Two images from one Dockerfile, both in the studio ECR repo:
#   <sha>        target `app`   - the admin/API (Next.js standalone)
#   tools-<sha>  target `tools` - the publish worker; the deploy also runs
#                                 `payload migrate` with it before restarting
name: Deploy to staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write # OIDC -> AWS, no stored keys
  contents: read

concurrency:
  group: staging-deploy-studio
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  APP: studio
  ROLE_ARN: arn:aws:iam::088850687177:role/staging-shared-deploy-studio
  ECR_REPO: 088850687177.dkr.ecr.us-east-1.amazonaws.com/staging-shared/studio
  SSM_DOCUMENT: staging-shared-deploy-studio
  HOST_TAG: staging-shared
  # Inlined by `next build`, so changing it means rebuilding.
  SERVER_URL: https://studio.cobsolution.cloud

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04-arm # the host is Graviton: build arm64 natively
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Already built?
        id: exists
        run: |
          # Tags are immutable: re-running the same commit reuses its images.
          if aws ecr describe-images --repository-name "staging-shared/$APP" \
               --image-ids imageTag="$GITHUB_SHA" imageTag="tools-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Images for $GITHUB_SHA already in ECR, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      # The GitHub Actions cache keeps the dependency layers identical between
      # builds, so the host pulls (and stores) only what changed, not 1.6 GB.
      - name: Build and push the app image (tag = commit SHA)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REPO }}:${{ github.sha }}
          build-args: NEXT_PUBLIC_SERVER_URL=${{ env.SERVER_URL }}
          provenance: false
          cache-from: type=gha,scope=studio-app
          cache-to: type=gha,scope=studio-app,mode=max

      - name: Build and push the worker image (tag = tools-<commit SHA>)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REPO }}:tools-${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=studio-tools
          cache-to: type=gha,scope=studio-tools,mode=max

      - name: Deploy on the host (SSM)
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$HOST_TAG" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Host: $IID"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name "$SSM_DOCUMENT" \
            --parameters "tag=$GITHUB_SHA" \
            --comment "$GITHUB_REPOSITORY@${GITHUB_SHA::7} by $GITHUB_ACTOR" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          STATUS=Pending
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query StandardErrorContent --output text >&2
          echo "Result: $STATUS"
          [ "$STATUS" = "Success" ]
